name: backslash-prod

services:
  caddy:
    build: { context: .., target: web }
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api, collab]

  api:
    build: { context: .., target: service, args: { APP: api } }
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      DATABASE_URL: postgres://backslash:${POSTGRES_PASSWORD:?}@postgres:5432/backslash
      VALKEY_URL: valkey://valkey:6379
      PUBLIC_URL: ${PUBLIC_URL:?}
      TRUST_PROXY: uniquelocal
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      INTERNAL_SECRET: ${INTERNAL_SECRET:?}
      COLLAB_INTERNAL_URL: http://collab:1235
      COMPILE_DIR: /data/compiles
      BLOB_DIR: /data/blobs
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-backslash <no-reply@localhost>}
      MAX_PROJECTS_PER_USER: ${MAX_PROJECTS_PER_USER:-100}
      MAX_STORAGE_PER_USER_MB: ${MAX_STORAGE_PER_USER_MB:-1024}
    volumes:
      - blobs:/data/blobs
      - compiles:/data/compiles
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }

  collab:
    build: { context: .., target: service, args: { APP: collab } }
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      INTERNAL_HOST: 0.0.0.0
      DATABASE_URL: postgres://backslash:${POSTGRES_PASSWORD:?}@postgres:5432/backslash
      VALKEY_URL: valkey://valkey:6379
      PUBLIC_URL: ${PUBLIC_URL:?}
      WEB_ORIGIN: ${PUBLIC_URL:?}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      INTERNAL_SECRET: ${INTERNAL_SECRET:?}
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }

  compiler:
    build: { context: .., target: compiler, args: { APP: compiler } }
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./compiler-seccomp.json
      - systempaths=unconfined
      - apparmor=unconfined
    environment:
      VALKEY_URL: valkey://valkey:6379
      CONCURRENCY: ${COMPILE_CONCURRENCY:-2}
      COMPILE_DIR: /data/compiles
      CACHE_DIR: /data/compile-cache
      BLOB_DIR: /data/blobs
    volumes:
      - blobs:/data/blobs:ro
      - compiles:/data/compiles
    depends_on:
      valkey: { condition: service_healthy }

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: backslash
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: backslash
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "backslash"]
      interval: 5s
      timeout: 3s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: valkey-server --appendonly yes
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
  valkey-data:
  blobs:
  compiles:
  caddy-data:
  caddy-config:
